metadata:
  description: "Default planning configuration for the AMS-02-like ECAL fast-MC pipeline."
  status: "planning-only; not a validated detector simulation"
  project_root: ".."

global:
  seed: 20260214

detector:
  name: "AMS-02-like simplified detector"
  magnetic_field_T: 0.15
  tracker:
    status: "deferred to Phase 1 repair and validation"
    use_parameterized_resolution_until_validated: true

ecal:
  status: "geometry contract only; shower generator deferred"
  depth_radiation_lengths: 17
  superlayers: 9
  longitudinal_samplings: 18
  lateral_cells_per_layer: 72
  total_cells: 1296
  views:
    pattern: "alternating x/y superlayers"
    x_superlayers: 5
    y_superlayers: 4
  validation_targets:
    electron_energy_resolution: "sqrt(0.104^2 / E_GeV + 0.014^2)"
    note: "Target only; not yet achieved by this repository."

energy_range:
  min_GeV: 1.0
  max_GeV: 1000.0
  sampling: "future decision; likely log-uniform for validation campaigns"

electron_generation:
  status: "first Phase 2 simulation milestone"
  include_positrons_with_same_ecal_response: true
  future_tunable_parameters:
    - longitudinal_shower_fluctuations
    - lateral_core_tail_scale
    - leakage_model

proton_generation:
  status: "deferred until electron validation exists"
  approximation_warning: "Proton fast-MC requires Geant4 or reference validation."
  future_components:
    - mip_like_events
    - early_hadronic_interactions
    - late_hadronic_interactions
    - electromagnetic_subshowers
    - invisible_energy

digitization:
  status: "deferred"
  sampling_fluctuations: "future tunable value"
  electronic_noise_GeV: "future tunable value"
  threshold_GeV: "future tunable value"

output_paths:
  generated_data: "data/generated"
  processed_data: "data/processed"
  external_data: "data/external"
  figures: "outputs/figures"
  model_checkpoints: "models/checkpoints"

dataset_campaigns:
  train:
    seed_offset: 0
    purpose: "independent training campaign"
  validation:
    seed_offset: 1000
    purpose: "independent model-selection campaign"
  test:
    seed_offset: 2000
    purpose: "independent final-evaluation campaign"
